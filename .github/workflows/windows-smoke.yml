name: Windows smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        # same kind of path as the real install (spaces, Google Drive style)
        working-directory: My Drive/jokerzz aio/aio-task-manager
    steps:
      - uses: actions/checkout@v4
        with:
          path: My Drive/jokerzz aio/aio-task-manager
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: INSTALL-JOKERZ.bat
        shell: cmd
        run: call INSTALL-JOKERZ.bat < NUL

      - name: Tests
        shell: cmd
        run: npm test

      - name: START-JOKERZ.bat (background)
        shell: pwsh
        run: |
          Start-Process -FilePath cmd.exe -ArgumentList '/c "START-JOKERZ.bat < NUL > start.log 2>&1"' -WorkingDirectory (Get-Location).Path -WindowStyle Hidden
          Start-Sleep 5

      - name: Smoke test (UI, API, logs, browser tabs, restart)
        shell: cmd
        run: node scripts\windows-smoke.mjs --out smoke-out --wait 300

      - name: STOP-JOKERZ.bat
        if: always()
        shell: cmd
        run: call STOP-JOKERZ.bat /nopause

      - name: Ports 8080 / 8787 closed after STOP
        shell: pwsh
        run: |
          Start-Sleep 6
          $l = Get-NetTCPConnection -LocalPort 8080,8787 -State Listen -ErrorAction SilentlyContinue
          if ($l) { Write-Error "still listening on: $($l.LocalPort -join ',')"; exit 1 }
          $n = Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.CommandLine -match 'launcher\.mjs|aio-api\.mjs|vite' }
          if ($n) { Write-Error "AIO node processes still running"; exit 1 }

      - name: scripts\windows\START-JOKERZ.bat also works
        shell: pwsh
        run: |
          Start-Process -FilePath cmd.exe -ArgumentList '/c "scripts\windows\START-JOKERZ.bat < NUL > start2.log 2>&1"' -WorkingDirectory (Get-Location).Path -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 3; try { $r = Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {} }
          cmd /c "STOP-JOKERZ.bat /nopause"
          if (-not $ok) { Get-Content start2.log -Tail 40; exit 1 }

      - name: CREATE-SHORTCUT.bat
        shell: cmd
        run: |
          call CREATE-SHORTCUT.bat < NUL
          if not exist "%USERPROFILE%\Desktop\Jokerz AIO.lnk" (
            echo Shortcut not created
            exit /b 1
          )

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-node${{ matrix.node }}
          path: |
            My Drive/jokerzz aio/aio-task-manager/smoke-out
            My Drive/jokerzz aio/aio-task-manager/start.log
            My Drive/jokerzz aio/aio-task-manager/start2.log
            My Drive/jokerzz aio/aio-task-manager/logs
          if-no-files-found: warn
